name: Create release
run-name: ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version: the Moodle version, optionally with an image revision (X.Y.Z or X.Y.Z.N)'
        type: string
        required: true
      chart_version:
        description: 'Helm chart version (X.Y.Z, higher than the current one). Empty = patch-bump the current chart version'
        type: string
        required: false
        default: ''
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true

jobs:
  # custom_version and bump_command end up in shell scripts, so only values
  # checked here may go into them; the inputs themselves are never spliced in.
  check:
    name: Check versions
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_version: ${{ steps.check.outputs.release_version }}
      chart_version: ${{ steps.check.outputs.chart_version }}
    steps:
      - id: check
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::release_version must be X.Y.Z or X.Y.Z.N, got '$RELEASE_VERSION'"
            exit 1
          fi
          if ! [[ "$CHART_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)?$ ]]; then
            echo "::error::chart_version must be X.Y.Z or empty, got '$CHART_VERSION'"
            exit 1
          fi
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-release.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      images: '["docker.io/cloudtooling/moodle"]'
      client_id: ${{ vars.CI_CLIENT_ID || vars.CI_APP_ID }}
      release_type: custom
      custom_version: ${{ needs.check.outputs.release_version }}
      default_branch: ${{ github.ref_name }}
      draft_release: ${{ inputs.draft_release }}
      dockerhub: true
      # Pin the chart's image.tag, appVersion and annotations image to the
      # release version in the release commit, and patch-bump the chart version
      # (or set the given one).
      bump_command: scripts/pin-release-version.sh "$RELEASE_VERSION" "${{ needs.check.outputs.chart_version }}"
    # The template lives in another org, where `secrets: inherit` doesn't apply.
    secrets:
      CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  # Publish the Helm chart pinned by the release commit (appVersion + image
  # tag == release version) as an OCI artifact.
  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: [check, release]
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.release_version }}
      CHART_VERSION: ${{ needs.check.outputs.chart_version }}
    steps:
      # The release commit, not the v<version> tag: a draft release has no tag yet.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Helm Package
        run: |
          helm package charts/moodle
          # Guards that scripts/pin-release-version.sh ran in the release commit.
          helm show chart ./*.tgz | grep -qx "appVersion: \"\?${VERSION}\"\?"
          if [ -n "$CHART_VERSION" ]; then
            helm show chart ./*.tgz | grep -qx "version: ${CHART_VERSION}"
          fi

      - name: Login to GitHub Container Registry
        env:
          OCI_TOKEN: ${{ secrets.CT_OCI_GITHUB_TOKEN }}
        run: echo "$OCI_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in *.tgz; do
            # An OCI push silently replaces an existing chart version.
            name="$(helm show chart "$pkg" | sed -n "s/^name: //p")"
            version="$(helm show chart "$pkg" | sed -n "s/^version: //p")"
            if helm show chart "oci://ghcr.io/cloudtooling/helm-charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "::error::Chart $name $version is already published, pass a higher chart_version"
              exit 1
            fi
            helm push "${pkg}" oci://ghcr.io/cloudtooling/helm-charts
          done
          rm -f ./*.tgz
