annotations:
  category: E-Learning
  images: |
    - name: apache-exporter
      image: docker.io/bitnami/apache-exporter:latest
    - name: mariadb
      image: docker.io/bitnami/mariadb:latest
    - name: moodle
      image: docker.io/cloudtooling/moodle:5.2.1
    - name: os-shell
      image: docker.io/bitnami/os-shell:latest
  licenses: Apache-2.0
  tanzuCategory: application
apiVersion: v2
# renovate: datasource=github-tags depName=moodle/moodle
appVersion: 5.0.9
dependencies:
- condition: mariadb.enabled
  name: mariadb
  repository: oci://registry-1.docker.io/bitnamicharts
  version: 22.x.x
- name: common
  repository: oci://registry-1.docker.io/bitnamicharts
  tags:
  - bitnami-common
  version: 2.x.x
description: Moodle(TM) LMS is an open source online Learning Management System widely
  used at universities, schools, and corporations. It is modular and highly adaptable
  to any type of online learning.
home: https://github.com/CloudTooling
icon: https://dyltqmyl993wv.cloudfront.net/assets/stacks/moodle/img/moodle-stack-220x234.png
keywords:
- moodle
- learning
- php
maintainers:
- name: Martin Reinhardt
  url: https://m13t.de
name: moodle
sources:
- https://github.com/CloudTooling/moodle
version: 1.0.1
